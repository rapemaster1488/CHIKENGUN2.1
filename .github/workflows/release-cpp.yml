name: Build Downloadable C++ Release (Linux x86_64)

on:
  workflow_dispatch:
    inputs:
      tex_size:
        description: "Разрешение вшитых PBR текстур (2048 быстрее скачивать, 4096 максимум)"
        required: false
        default: "2048"
        type: choice
        options:
          - "2048"
          - "4096"
      publish_release:
        description: "Опубликовать GitHub Release для скачивания"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Тег релиза (если publish_release=true)"
        required: false
        default: "v2.4.0"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-cpp-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native C++17 / OpenGL / X11 / SDL2 / ALSA build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libsdl2-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libxss-dev libxxf86vm-dev \
            libasound2-dev libpulse-dev libudev-dev

      - name: Cache compiled Urho3D C++ engine
        id: cache-urho
        uses: actions/cache@v4
        with:
          path: /tmp/urho3d_sdk
          key: urho3d-linux-x64-static-v1

      - name: Build Urho3D C++ SDK (on cache miss)
        if: steps.cache-urho.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/urho3d/Urho3D.git /tmp/urho3d_src
          cmake -S /tmp/urho3d_src -B /tmp/urho3d_sdk \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DURHO3D_LIB_TYPE=STATIC \
            -DURHO3D_SAMPLES=OFF \
            -DURHO3D_TOOLS=OFF \
            -DURHO3D_EXTRAS=OFF \
            -DURHO3D_LUA=OFF \
            -DURHO3D_ANGELSCRIPT=OFF \
            -DURHO3D_NETWORK=OFF \
            -DURHO3D_DATABASE=OFF \
            -DURHO3D_URHO2D=OFF \
            -DURHO3D_WEBP=OFF \
            -DURHO3D_PCH=OFF
          cmake --build /tmp/urho3d_sdk -j"$(nproc)"
          mkdir -p /tmp/urho3d_sdk/include
          cp -rn /tmp/urho3d_src/Source/Urho3D /tmp/urho3d_sdk/include/Urho3D || true
          mkdir -p /tmp/urho3d_sdk/include/Urho3D/ThirdParty
          cp -rn /tmp/urho3d_src/Source/ThirdParty/Bullet/src /tmp/urho3d_sdk/include/Urho3D/ThirdParty/Bullet || true

      - name: Run C++ Core Unit Tests before packaging
        run: |
          cmake -B build_tests -DBUILD_GAME=OFF
          cmake --build build_tests -j"$(nproc)"
          ctest --test-dir build_tests --output-on-failure

      - name: Compile MyShooter (C++17) & package portable Linux archive
        env:
          URHO3D_HOME: /tmp/urho3d_sdk
          TEX_SIZE: ${{ inputs.tex_size || '2048' }}
          VERSION: "2.4"
        run: |
          python3 tools/gen_sounds.py
          chmod +x build.sh run.sh tools/package_linux.sh
          ./tools/package_linux.sh

      - name: Upload downloadable C++ game archive (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CHIKENGUN-2.4-Linux-x86_64
          path: |
            build/release/CHIKENGUN-*.tar.gz
            build/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release (on v* tag or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            gh release upload "$REL_TAG" build/release/CHIKENGUN-*.tar.gz build/release/SHA256SUMS.txt --clobber
          else
            gh release create "$REL_TAG" \
              build/release/CHIKENGUN-*.tar.gz \
              build/release/SHA256SUMS.txt \
              --title "CHIKENGUN 2.4 — Native C++17 / Urho3D Edition ($REL_TAG)" \
              --notes "Скачиваемая C++ сборка CHIKENGUN 2.4 для Linux x86_64. Распакуйте архив и запустите ./ChikenGun.sh."
          fi
